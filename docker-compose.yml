# Manufacturing Intelligence: the website, the MCP server and their search index (Qdrant). One image for both.
#   docker compose up -d --build        then: docker compose logs -f mi-mcp   (shows the PUBLIC MCP LINK)
#   the website: http://127.0.0.1:8094 (MI_WEB_PORT)          the MCP server: http://127.0.0.1:8096/mcp (MI_MCP_PORT)
# Secrets come from .env at run time (never copied into the image). See DEPLOY.md.
# Production: set CLOUDFLARE_TUNNEL_TOKEN (the company's fixed tunnel).
# Branch docker-mysql: MySQL runs here too (service "mysql", data kept in the mysql_data volume), so the PC needs
# only Docker. First start: set DOCKER_MYSQL_ROOT_PASSWORD in .env, then load the data once:
#   docker compose --profile load run --rm loader
# Another MySQL server instead: set DOCKER_MYSQL_HOST (and that server's users) - see DEPLOY.md.
name: manufacturing-intelligence

services:
  # MySQL 8.4 for the data (ai_gold) and the app's own schema (chats, history, users). The schemas and the two
  # users are made on the first start (docker/mysql-init); the data files live in the mysql_data volume, so they
  # stay over restarts, updates and "docker compose down" (only "down -v" deletes them).
  mysql:
    image: mysql:8.4.6
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DOCKER_MYSQL_ROOT_PASSWORD:?set DOCKER_MYSQL_ROOT_PASSWORD in .env}
      AI_GOLD_DATABASE: ${AI_GOLD_DATABASE:-ai_gold}
      APP_DB_NAME: ${APP_DB_NAME:-}
      APP_DB_USER: ${APP_DB_USER:-}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-}
      AI_DB_USER: ${AI_DB_USER:-}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:-}
      TZ: ${TZ:-Asia/Kolkata}                    # CURRENT_DATE in the SQL = the office's day
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:   # over TCP: healthy only when the real server is up (the first-start setup has no network)
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
    ports:
      - "127.0.0.1:${MI_MYSQL_PORT:-3307}:3306"   # this PC only, for a MySQL tool (3306 may be taken by a local MySQL)
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
      - ./backups:/backups                       # the backup command in DEPLOY.md writes here

  # one-off: fills ai_gold from inputdata/ (not in git - copy the folder next to this file first)
  #   docker compose --profile load run --rm loader
  loader:
    profiles: ["load"]
    build: .
    image: manufacturing-intelligence:latest
    depends_on:
      mysql:
        condition: service_healthy
    env_file: .env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ${DOCKER_MYSQL_ROOT_PASSWORD:?set DOCKER_MYSQL_ROOT_PASSWORD in .env}
    entrypoint: ["python", "loader/load_gold.py"]
    volumes:
      - ./loader:/app/loader:ro
      - ./inputdata:/app/inputdata:ro

  qdrant:
    image: qdrant/qdrant:v1.19.2
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY in .env}
    volumes:
      - qdrant_data:/qdrant/storage

  mi-mcp:
    build: .
    image: manufacturing-intelligence:latest
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_started
      mysql:
        condition: service_healthy
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      MYSQL_HOST: ${DOCKER_MYSQL_HOST:-mysql}
      MYSQL_PORT: ${DOCKER_MYSQL_PORT:-3306}
      PUBLIC_LINK: ${PUBLIC_LINK:-quick}
      CLOUDFLARE_TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${MI_MCP_PORT:-8096}:8000"   # this PC only (8000 is often taken); the public link goes through the tunnel
    volumes:
      - app_data:/app/data                     # History (SQLite, when APP_DB_NAME is empty)
      - model_cache:/app/.fastembed_cache      # the search model (~210 MB, downloaded once)

  # the website (Django + the React build) with gunicorn; static files by WhiteNoise, no tunnel
  mi-web:
    build: .
    image: manufacturing-intelligence:latest
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_started
      mysql:
        condition: service_healthy
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      MYSQL_HOST: ${DOCKER_MYSQL_HOST:-mysql}
      MYSQL_PORT: ${DOCKER_MYSQL_PORT:-3306}
      DJANGO_DEBUG: ${DOCKER_DJANGO_DEBUG:-False}   # never the laptop's DEBUG=True in a container
      PUBLIC_LINK: "off"                          # the quick link is the MCP server's, not the website's
      CLOUDFLARE_TUNNEL_TOKEN: ""
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # one worker = one copy of the search model in memory; its threads answer several people at once.
    # 300 s: one question can take a few AI calls (and Groq's rate-limit waits)
    command: ["gunicorn", "nopsite.wsgi:application", "--bind", "0.0.0.0:8000",
              "--workers", "${MI_WEB_WORKERS:-1}", "--threads", "${MI_WEB_THREADS:-8}",
              "--timeout", "300", "--access-logfile", "-"]
    ports:
      - "127.0.0.1:${MI_WEB_PORT:-8094}:8000"   # this PC only; put an https proxy / tunnel in front for others
    volumes:
      - app_data:/app/data
      - model_cache:/app/.fastembed_cache

volumes:
  mysql_data:
  qdrant_data:
  app_data:
  model_cache:
